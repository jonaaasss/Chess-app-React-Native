# Publishes an over-the-air update (EAS Update) for the permanent app on
# every push to account-backup. The app downloads it on start and runs it on
# the next start. Only JavaScript and assets travel this way; native changes
# need a new build (bump "version" in app.json, then npm run android:permanent).
name: update
on:
  push:
    branches: [account-backup]
    paths-ignore:
      - '**.md'
      - 'docs/**'
concurrency:
  group: eas-update
  cancel-in-progress: true
jobs:
  update:
    name: Expo Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN secret to this repository (see STATUS.md)."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Publish update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --channel production --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" --environment production --non-interactive
